<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Site</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a> |
        <a href="{% url 'about' %}">About</a> |
        <a href="{% url 'hobbies' %}">Hobbies</a>
    </nav>
    <h1>Hobbies</h1>
    <ul>
        {% for hobby in hobbies %}
            <li>{{ hobby.name }} - {{ hobby.hours }} hours a week</li>
        {% endfor %}
    </ul>
    <p>I have {{ hobbies|length }} hobbies.</p>
</body>
</html>
