<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Site</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a> |
        <a href="{% url 'about' %}">About</a> |
        <a href="{% url 'hobbies' %}">Hobbies</a>
    </nav>
    <h1>
        About{{name}}
    </h1>
    <p>{{ name }} არის {{ age }} წლის და ცხოვრობს ქალაქ {{ city }}-ში.</p>

    {% if age >= 18 %}
        <p>I am an adult.</p>
    {% else %}
        <p>I am not an adult yet.</p>
    {% endif %}
</body>
</html>
